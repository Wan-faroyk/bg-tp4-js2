<!DOCTYPE html>
<html lang="fr">
    <head>
      <meta charset="UTF-8">
      <title>TP4-Etape5 : Insertion via des champs de saisie</title>
      <!-- fichier css externe (cours CSS slide 21) -->
      <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- div conteneur (cours HTML slide 122) -->
        <div id="table_container">

            <!-- formulaire au dessus du tableau (code donne dans le TP) -->
            <div id="form_container">
                <div class="form_group">
                    <label class="form_label">Nom:</label>
                    <input type="text" id="form_nom" class="form_field"/>
                </div>
                <div class="form_group">
                    <label class="form_label">Prénom:</label>
                    <input type="text" id="form_prenom" class="form_field"/>
                </div>
                <div class="form_group">
                    <label class="form_label">Points:</label>
                    <input type="number" id="form_points" class="form_field"/>
                </div>
                <!-- evenement onclick (cours JS slide 133) -->
                <button onclick="doNewData()">Ajouter</button>
            </div>

            <!-- tableau (cours HTML slides 112 a 118) -->
            <table>
                <thead>
                     <tr>
                    <th class="col_number">N°</th>
                    <th class="col_text">Nom</th>
                    <th class="col_text">Prénom</th>
                    <th class="col_number">Points</th>
                    <th class="col_chkbox">Select</th>
                     </tr>
                </thead>
                <!-- tbody vide, les lignes sont ajoutees par le js -->
                <tbody>
                </tbody>
            </table>

            <!-- espace resume avec des paragraphes (cours HTML slide 60) -->
            <div id="container_summary">
                <p id="p1">0 ligne(s)</p>
                <p id="p2"></p>
                <p id="p3">Totale point(s)= 0</p>
            </div>

            <button onclick="consoleTableau()">Console Tableau</button>
        </div>

        <!-- fichier js externe (cours JS slide 24), mis a la fin du body (cours JS slide 27) -->
        <script src="script.js"></script>
    </body>
</html>
